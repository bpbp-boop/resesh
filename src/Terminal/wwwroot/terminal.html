<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>terminal</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0c0c0c; overflow: hidden; }
  #term {
    position: relative;
    box-sizing: border-box;
    height: 100%;
    width: 100%;
    padding-left: 6px;
  }
  .xterm .xterm-viewport { overflow-y: auto; }
  /* The annotated ruler (addon-ruler.js) replaces the native scrollbar. */
  .xterm .xterm-viewport::-webkit-scrollbar { display: none; }

  /* Find bar (Ctrl+Shift+F): VS Code-style floating panel, top-right over the terminal. */
  #findbar {
    position: absolute; top: 0; right: 14px; z-index: 10;
    display: none; align-items: center; gap: 4px;
    padding: 4px 6px; border-radius: 0 0 6px 6px;
    background: #252526; border: 1px solid #454545; border-top: none;
    font-family: "Segoe UI", sans-serif; font-size: 12px; color: #cccccc;
  }
  body.light-ui #findbar { background: #f3f3f3; border-color: #c8c8c8; color: #333333; }
  #findbar input {
    width: 180px; padding: 3px 6px; border: 1px solid transparent; border-radius: 3px;
    background: #3c3c3c; color: inherit; font-size: 12px; outline: none;
  }
  body.light-ui #findbar input { background: #ffffff; border-color: #c8c8c8; }
  #findbar input:focus { border-color: #007fd4; }
  #findbar button {
    min-width: 22px; height: 22px; padding: 0 3px; border: none; border-radius: 3px;
    background: transparent; color: inherit; font-size: 11px; cursor: pointer;
  }
  #findbar button:hover { background: rgba(128, 128, 128, 0.25); }
  #findbar button.on { background: #007fd4; color: #ffffff; }
  #find-count { min-width: 52px; text-align: center; opacity: 0.8; white-space: nowrap; }
  /* The ruler's commands panel hugs the top-right corner the find bar opens into;
     while the find bar is up, the panel steps down below it instead of fighting it. */
  body.find-open .scroll-ruler-panel { top: 38px; }
</style>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-web-links.js"></script>
<script src="addon-search.js"></script>
<script src="addon-highlight.js"></script>
<script src="addon-serialize.js"></script>
<script src="addon-ruler.js"></script>
</head>
<body>
<div id="term"></div>
<div id="findbar">
  <input id="find-input" type="text" placeholder="Find" spellcheck="false" autocomplete="off">
  <span id="find-count"></span>
  <button id="find-case" title="Match case">Aa</button>
  <button id="find-regex" title="Use regular expression">.*</button>
  <button id="find-prev" title="Previous match (Shift+Enter)">&#9650;</button>
  <button id="find-next" title="Next match (Enter)">&#9660;</button>
  <button id="find-close" title="Close (Esc)">&#10005;</button>
</div>
<script>
(function () {
  "use strict";

  const DARK_THEME = {
    background: "#0c0c0c", foreground: "#cccccc", cursor: "#ffffff",
    black: "#0c0c0c", red: "#c50f1f", green: "#13a10e", yellow: "#c19c00",
    blue: "#0037da", magenta: "#881798", cyan: "#3a96dd", white: "#cccccc",
    brightBlack: "#767676", brightRed: "#e74856", brightGreen: "#16c60c",
    brightYellow: "#f9f1a5", brightBlue: "#3b78ff", brightMagenta: "#b4009e",
    brightCyan: "#61d6d6", brightWhite: "#f2f2f2"
  };
  // Annotated scrollbar (ROADMAP Phase 9.2) palettes, one per terminal theme.
  const DARK_RULER = {
    background: "#0c0c0c", border: "#333333", thumb: "rgba(255,255,255,0.10)",
    match: "#7f8ea3", activeMatch: "#f2cc60", bookmark: "#61d6d6",
    flash: "rgba(242,204,96,0.28)", pending: "rgba(255,255,255,0.06)",
    cmdOk: "#2ea043", cmdFail: "#ff5555", cmdUnknown: "#9e9e9e",
    tooltipBg: "#1e1e2b", tooltipFg: "#e6edf3", tooltipMuted: "#a7a7b5",
    tooltipBorder: "#3a3a50"
  };
  const LIGHT_RULER = {
    background: "#ffffff", border: "#dddddd", thumb: "rgba(0,0,0,0.10)",
    match: "#5a6b85", activeMatch: "#c18401", bookmark: "#0997b3",
    flash: "rgba(193,132,1,0.22)", pending: "rgba(0,0,0,0.06)",
    cmdOk: "#50a14f", cmdFail: "#e45649", cmdUnknown: "#6a6a6a",
    tooltipBg: "#f7f7fa", tooltipFg: "#24242b", tooltipMuted: "#666675",
    tooltipBorder: "#c8c8d2"
  };
  const LIGHT_THEME = {
    background: "#ffffff", foreground: "#383a42", cursor: "#383a42",
    selectionBackground: "#bfceff",
    black: "#383a42", red: "#e45649", green: "#50a14f", yellow: "#c18401",
    blue: "#0184bc", magenta: "#a626a4", cyan: "#0997b3", white: "#fafafa",
    brightBlack: "#4f525e", brightRed: "#e06c75", brightGreen: "#98c379",
    brightYellow: "#e5c07b", brightBlue: "#61afef", brightMagenta: "#c678dd",
    brightCyan: "#56b6c2", brightWhite: "#ffffff"
  };
  const THEMES = {
    dark: DARK_THEME,
    light: LIGHT_THEME,
    "solarized-dark": {
      background: "#002b36", foreground: "#839496", cursor: "#93a1a1", selectionBackground: "#274852",
      black: "#073642", red: "#dc322f", green: "#859900", yellow: "#b58900", blue: "#268bd2", magenta: "#d33682", cyan: "#2aa198", white: "#eee8d5",
      brightBlack: "#002b36", brightRed: "#cb4b16", brightGreen: "#586e75", brightYellow: "#657b83", brightBlue: "#839496", brightMagenta: "#6c71c4", brightCyan: "#93a1a1", brightWhite: "#fdf6e3"
    },
    "solarized-light": {
      background: "#fdf6e3", foreground: "#657b83", cursor: "#586e75", selectionBackground: "#eee8d5",
      black: "#073642", red: "#dc322f", green: "#859900", yellow: "#b58900", blue: "#268bd2", magenta: "#d33682", cyan: "#2aa198", white: "#eee8d5",
      brightBlack: "#002b36", brightRed: "#cb4b16", brightGreen: "#586e75", brightYellow: "#657b83", brightBlue: "#839496", brightMagenta: "#6c71c4", brightCyan: "#93a1a1", brightWhite: "#fdf6e3"
    },
    dracula: {
      background: "#282a36", foreground: "#f8f8f2", cursor: "#f8f8f2", selectionBackground: "#44475a",
      black: "#21222c", red: "#ff5555", green: "#50fa7b", yellow: "#f1fa8c", blue: "#bd93f9", magenta: "#ff79c6", cyan: "#8be9fd", white: "#f8f8f2",
      brightBlack: "#6272a4", brightRed: "#ff6e6e", brightGreen: "#69ff94", brightYellow: "#ffffa5", brightBlue: "#d6acff", brightMagenta: "#ff92df", brightCyan: "#a4ffff", brightWhite: "#ffffff"
    },
    "one-dark": {
      background: "#282c34", foreground: "#abb2bf", cursor: "#528bff", selectionBackground: "#3e4451",
      black: "#282c34", red: "#e06c75", green: "#98c379", yellow: "#e5c07b", blue: "#61afef", magenta: "#c678dd", cyan: "#56b6c2", white: "#abb2bf",
      brightBlack: "#5c6370", brightRed: "#e06c75", brightGreen: "#98c379", brightYellow: "#e5c07b", brightBlue: "#61afef", brightMagenta: "#c678dd", brightCyan: "#56b6c2", brightWhite: "#ffffff"
    },
    nord: {
      background: "#2e3440", foreground: "#d8dee9", cursor: "#d8dee9", selectionBackground: "#434c5e",
      black: "#3b4252", red: "#bf616a", green: "#a3be8c", yellow: "#ebcb8b", blue: "#81a1c1", magenta: "#b48ead", cyan: "#88c0d0", white: "#e5e9f0",
      brightBlack: "#4c566a", brightRed: "#bf616a", brightGreen: "#a3be8c", brightYellow: "#ebcb8b", brightBlue: "#81a1c1", brightMagenta: "#b48ead", brightCyan: "#8fbcbb", brightWhite: "#eceff4"
    },
    "gruvbox-dark": {
      background: "#282828", foreground: "#ebdbb2", cursor: "#ebdbb2", selectionBackground: "#504945",
      black: "#282828", red: "#cc241d", green: "#98971a", yellow: "#d79921", blue: "#458588", magenta: "#b16286", cyan: "#689d6a", white: "#a89984",
      brightBlack: "#928374", brightRed: "#fb4934", brightGreen: "#b8bb26", brightYellow: "#fabd2f", brightBlue: "#83a598", brightMagenta: "#d3869b", brightCyan: "#8ec07c", brightWhite: "#ebdbb2"
    },
    monokai: {
      background: "#272822", foreground: "#f8f8f2", cursor: "#f8f8f0", selectionBackground: "#49483e",
      black: "#272822", red: "#f92672", green: "#a6e22e", yellow: "#f4bf75", blue: "#66d9ef", magenta: "#ae81ff", cyan: "#a1efe4", white: "#f8f8f2",
      brightBlack: "#75715e", brightRed: "#f92672", brightGreen: "#a6e22e", brightYellow: "#f4bf75", brightBlue: "#66d9ef", brightMagenta: "#ae81ff", brightCyan: "#a1efe4", brightWhite: "#f9f8f5"
    },
    "tokyo-night": {
      background: "#1a1b26", foreground: "#c0caf5", cursor: "#c0caf5", selectionBackground: "#33467c",
      black: "#15161e", red: "#f7768e", green: "#9ece6a", yellow: "#e0af68", blue: "#7aa2f7", magenta: "#bb9af7", cyan: "#7dcfff", white: "#a9b1d6",
      brightBlack: "#414868", brightRed: "#f7768e", brightGreen: "#9ece6a", brightYellow: "#e0af68", brightBlue: "#7aa2f7", brightMagenta: "#bb9af7", brightCyan: "#7dcfff", brightWhite: "#c0caf5"
    },
    "catppuccin-mocha": {
      background: "#1e1e2e", foreground: "#cdd6f4", cursor: "#f5e0dc", selectionBackground: "#45475a",
      black: "#45475a", red: "#f38ba8", green: "#a6e3a1", yellow: "#f9e2af", blue: "#89b4fa", magenta: "#f5c2e7", cyan: "#94e2d5", white: "#bac2de",
      brightBlack: "#585b70", brightRed: "#f38ba8", brightGreen: "#a6e3a1", brightYellow: "#f9e2af", brightBlue: "#89b4fa", brightMagenta: "#f5c2e7", brightCyan: "#94e2d5", brightWhite: "#a6adc8"
    },
    "phthalo-green": {
      background: "#123524", foreground: "#d7eee5", cursor: "#72e0ad", selectionBackground: "#245a46",
      black: "#081812", red: "#ff6b6b", green: "#62d796", yellow: "#e6c766", blue: "#69a7ff", magenta: "#cf8df7", cyan: "#59d6c3", white: "#d7eee5",
      brightBlack: "#3b6b58", brightRed: "#ff8585", brightGreen: "#7ee2aa", brightYellow: "#f1d67b", brightBlue: "#86b8ff", brightMagenta: "#dda8fa", brightCyan: "#78e2d2", brightWhite: "#f1fff9"
    }
  };
  function getTheme(id) { return THEMES[id] || DARK_THEME; }
  function isLightTheme(id) { return id === "light" || id === "solarized-light"; }
  function getRuler(id) {
    const theme = getTheme(id);
    return Object.assign({}, isLightTheme(id) ? LIGHT_RULER : DARK_RULER, {
      background: theme.background,
      // Use the selection surface for the ruler edge. Some palettes (notably
      // Solarized Dark) define brightBlack as the terminal background itself.
      border: theme.selectionBackground || theme.brightBlack,
      tooltipBg: theme.background,
      tooltipFg: theme.foreground
    });
  }

  const host = window.chrome.webview;
  const container = document.getElementById("term");

  // Surface page-side failures in the host's trace.log; silent JS errors here have
  // already cost a debugging session (theme override silently not applying).
  function pageTrace(message) {
    try { host.postMessage({ type: "pageError", message: message }); } catch (_) {}
  }
  window.__pageTrace = pageTrace; // also used by addon-highlight.js
  window.addEventListener("error", function (e) { pageTrace("uncaught: " + e.message); });

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function strToB64(s) {
    const bytes = new TextEncoder().encode(s);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  // The terminal is constructed only after the host sends initOptions ("init" handshake
  // below), so it is born with the right theme/fonts: no dark flash before settings land,
  // and no reliance on a setOptions push racing the page's first frames.
  let onMessage = null;
  host.addEventListener("message", function (event) {
    const msg = event.data;
    if (onMessage) {
      onMessage(msg);
    } else if (msg.type === "initOptions") {
      boot(msg);
    }
  });
  host.postMessage({ type: "init" });

  function boot(init) {
    const term = new Terminal({
      scrollback: typeof init.scrollback === "number" ? init.scrollback : 10000,
      fontFamily: init.fontFamily || "Cascadia Mono, Consolas, monospace",
      fontSize: init.fontSize || 14,
      allowProposedApi: true,
      theme: getTheme(init.theme)
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.loadAddon(new WebLinksAddon.WebLinksAddon(function (_event, uri) {
      host.postMessage({ type: "openLink", uri: uri });
    }));
    const search = new SearchAddon.SearchAddon();
    term.loadAddon(search);
    const highlighter = new HighlightAddon.HighlightAddon();
    term.loadAddon(highlighter);
    if (Array.isArray(init.highlights)) highlighter.setRules(init.highlights);

    let copyOnSelect = typeof init.copyOnSelect === "boolean" ? init.copyOnSelect : true;
    let rightClickPaste = typeof init.rightClickPaste === "boolean" ? init.rightClickPaste : true;
    let connected = false;
    const readOnly = init.readOnly === true;

    term.open(container);
    document.body.style.background = term.options.theme.background;
    document.body.classList.toggle("light-ui", isLightTheme(init.theme));

    // The ruler addon builds DOM inside term.element, so it loads after open().
    const ruler = new RulerAddon.RulerAddon();
    term.loadAddon(ruler);
    ruler.setTheme(getRuler(init.theme));
    if (Array.isArray(init.highlights)) ruler.setHighlightRules(init.highlights);

    // Full VT state snapshots make bounded rewind seekable without approximating the screen.
    // Serialize after xterm has parsed a write, every 10 seconds or 1 MiB of host output.
    const serializer = new SerializeAddon.SerializeAddon();
    term.loadAddon(serializer);
    let keyframeBytes = 0;
    let lastKeyframeAt = Date.now();
    let keyframePending = false;

    function captureKeyframe() {
      if (readOnly) return;
      keyframePending = false;
      try {
        host.postMessage({
          type: "keyframe",
          data: strToB64(serializer.serialize()),
          unixMs: Date.now(),
          cols: term.cols,
          rows: term.rows
        });
        keyframeBytes = 0;
        lastKeyframeAt = Date.now();
      } catch (err) {
        pageTrace("keyframe: " + (err && err.message));
      }
    }

    function noteOutputForKeyframe(byteCount) {
      if (readOnly) return;
      keyframeBytes += byteCount;
      if (keyframePending || (keyframeBytes < 1024 * 1024 && Date.now() - lastKeyframeAt < 10000)) return;
      keyframePending = true;
      // xterm parses writes asynchronously. A short delay places serialization after its
      // write queue without adding any delay to live rendering.
      setTimeout(captureKeyframe, 50);
    }

    // ---- agent awareness (ROADMAP Phase 6.2) ----
    // The page only forwards evidence; every mapping decision (which agent, which
    // attention state, what outranks what) lives in the native AgentTracker, where it is
    // testable. Each tab has its own page, so an event can only ever describe its own tab.
    function postAgent(message) {
      try { host.postMessage(message); } catch (_) {}
    }
    [7377, 9, 777].forEach(function (code) {
      if (!term.parser || !term.parser.registerOscHandler) return;
      term.parser.registerOscHandler(code, function (data) {
        postAgent({ type: "agentOsc", code: code, data: String(data == null ? "" : data).slice(0, 2048) });
        return true;
      });
    });
    if (term.onBell) term.onBell(function () { postAgent({ type: "agentBell" }); });
    ruler.onCommandMark(function (command) {
      postAgent({ type: "command", text: String(command || "").slice(0, 512) });
    });

    function fitPreservingTimestamps() {
      ruler.captureTimestampReflow();
      fit.fit();
      ruler.restoreTimestampReflow();
    }

    // One native output message can contain several SSH reads combined by the 16 ms
    // host batch. Parse each original byte range with its pre-batch arrival time.
    function writeHostOutput(msg) {
      const bytes = b64ToBytes(msg.data);
      noteOutputForKeyframe(bytes.length);
      const ingest = Array.isArray(msg.ingest) ? msg.ingest : [];
      if (ingest.length === 0) {
        ruler.writeOutput(bytes, null); // compatibility with an older native host
        return;
      }
      for (let i = 0; i < ingest.length; i++) {
        const start = Math.max(0, Math.min(bytes.length, ingest[i].offset | 0));
        const end = i + 1 < ingest.length
          ? Math.max(start, Math.min(bytes.length, ingest[i + 1].offset | 0))
          : bytes.length;
        if (end > start) ruler.writeOutput(bytes.subarray(start, end), ingest[i].unixMs);
      }
    }

    // UI -> SSH
    term.onData(function (data) {
      if (readOnly) return;
      if (connected) {
        // Enter on a prompt-shaped line becomes a discovered command mark (Phase 9.4).
        // Checked before the input round-trips: the typed command is already echoed on
        // the cursor line, the resulting newline is not. A multi-line paste only marks
        // the first command — the rest echo asynchronously.
        if (data.indexOf("\r") >= 0) ruler.notifyEnter(titlesSeen);
        host.postMessage({ type: "input", data: strToB64(data) });
      } else if (data === "\r") {
        host.postMessage({ type: "reconnect" });
      }
    });

    // The window title is the only process hint a host without tmux gives us for free:
    // stock .bashrc emits OSC 0 "user@host: cwd" on every prompt (gated on TERM=xterm*,
    // which our default xterm-256color matches), and some full-screen programs set
    // their own while they run. The host turns this into the tab's second line.
    var titlesSeen = 0; // counts title changes; discovery epochs compare against it
    term.onTitleChange(function (title) {
      titlesSeen++;
      postAgent({ type: "title", text: String(title || "").slice(0, 512) });
    });

    // Titles only refresh AFTER a command finishes (the next prompt redraws them), so
    // between prompts the ruler reports what just started — Enter-gated discovery or
    // OSC 133. A discovered command with a stale epoch lost its race: a title arrived
    // after the Enter, meaning the command already finished (fast commands) or the
    // program titled itself; either way the title stream owns the subtitle now.
    // OSC 133 rides the output stream itself, already ordered against titles — no epoch.
    ruler.onRunningCommand = function (text, epoch) {
      if (epoch !== undefined && epoch !== titlesSeen) return;
      host.postMessage({
        type: "runningCommand",
        text: typeof text === "string" ? text.slice(0, 256) : "",
      });
    };
    ruler.onPromptContext = function (context, platform) {
      host.postMessage({
        type: "promptContext",
        text: typeof context === "string" ? context.slice(0, 512) : "",
        platform: typeof platform === "string" ? platform.slice(0, 32) : "",
      });
    };
    ruler.onWorkingDirectory = function (data) {
      host.postMessage({
        type: "workingDirectory",
        data: typeof data === "string" ? data.slice(0, 2048) : "",
      });
    };
    ruler.onContext = function (data) {
      host.postMessage({
        type: "osc3008",
        data: typeof data === "string" ? data.slice(0, 4096) : "",
      });
    };
    // Covers every way the panel state can change (host button, Ctrl+Shift+O, the
    // panel's own close button), so the native toggle button tracks the truth.
    ruler.onCommandsPanelChanged = function (open) {
      host.postMessage({ type: "commandsPanel", open: open === true });
    };
    ruler.onCopyText = function (text) {
      host.postMessage({ type: "copy", text: text });
    };

    term.onSelectionChange(function () {
      // Find selects each match it lands on; don't let copy-on-select clobber the clipboard.
      if (copyOnSelect && term.hasSelection() && findbar.style.display !== "flex") {
        host.postMessage({ type: "copy", text: term.getSelection() });
      }
    });

    // Keyboard input makes xterm return to the live cursor when the user has
    // scrolled back. Paste is input too, but not every paste route passes through
    // xterm's key handler (notably right-click and Ctrl+Shift+V), so do that
    // explicitly for all of them.
    function returnToLiveInput() {
      term.scrollToBottom();
    }

    function pasteText(text) {
      if (!text || !connected) return;
      returnToLiveInput();
      host.postMessage({ type: "input", data: strToB64(text) });
    }

    // Runs before xterm consumes a regular browser/textarea paste event.
    container.addEventListener("paste", returnToLiveInput, true);

    container.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      if (rightClickPaste) {
        host.postMessage({ type: "paste" });
      }
    });

    // ---- find bar (Ctrl+Shift+F) ----

    const findbar = document.getElementById("findbar");
    const findInput = document.getElementById("find-input");
    const findCount = document.getElementById("find-count");
    const findCase = document.getElementById("find-case");
    const findRegex = document.getElementById("find-regex");
    let findCaseOn = false;
    let findRegexOn = false;

    function searchOptions(incremental) {
      return {
        caseSensitive: findCaseOn,
        regex: findRegexOn,
        incremental: !!incremental,
        decorations: {
          matchBackground: "#515c6a",
          activeMatchBackground: "#f2cc60"
        }
      };
    }

    function runFind(direction, incremental) {
      const query = findInput.value;
      if (!query) {
        search.clearDecorations();
        ruler.clearSearch();
        findCount.textContent = "";
        return;
      }
      try {
        if (direction === "prev") search.findPrevious(query, searchOptions(false));
        else search.findNext(query, searchOptions(incremental));
        ruler.notifySearch(query, findCaseOn, findRegexOn);
      } catch (err) {
        ruler.clearSearch();
        findCount.textContent = "Bad regex"; // e.g. an unclosed group while typing
      }
    }

    search.onDidChangeResults(function (r) {
      if (!r || r.resultCount === 0) {
        findCount.textContent = findInput.value ? "No results" : "";
      } else if (r.resultCount === undefined || r.resultIndex === -1) {
        findCount.textContent = "";
      } else {
        // The addon stops counting at 1000 matches.
        const total = r.resultCount >= 1000 ? "999+" : r.resultCount;
        findCount.textContent = (r.resultIndex + 1) + " of " + total;
      }
    });

    function openFind() {
      findbar.style.display = "flex";
      document.body.classList.add("find-open");
      if (term.hasSelection()) {
        const sel = term.getSelection().trim();
        if (sel && sel.indexOf("\n") < 0) findInput.value = sel;
      }
      findInput.focus();
      findInput.select();
      if (findInput.value) runFind("next", true);
    }

    function closeFind() {
      findbar.style.display = "none";
      document.body.classList.remove("find-open");
      search.clearDecorations();
      ruler.clearSearch();
      findCount.textContent = "";
      term.focus();
    }

    findInput.addEventListener("input", function () { runFind("next", true); });
    findInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { runFind(e.shiftKey ? "prev" : "next", false); e.preventDefault(); }
      else if (e.key === "Escape") { closeFind(); e.preventDefault(); }
    });
    function bindToggle(button, get, set) {
      button.addEventListener("click", function () {
        set(!get());
        button.classList.toggle("on", get());
        runFind("next", true);
        findInput.focus();
      });
    }
    bindToggle(findCase, function () { return findCaseOn; }, function (v) { findCaseOn = v; });
    bindToggle(findRegex, function () { return findRegexOn; }, function (v) { findRegexOn = v; });
    document.getElementById("find-prev").addEventListener("click", function () { runFind("prev", false); findInput.focus(); });
    document.getElementById("find-next").addEventListener("click", function () { runFind("next", false); findInput.focus(); });
    document.getElementById("find-close").addEventListener("click", closeFind);

    // Capture at the page boundary so app shortcuts also work while either xterm or
    // its find field has focus. WebView2 does not forward the window accelerators.
    window.addEventListener("keydown", function (e) {
      if (!e.ctrlKey || !e.shiftKey || e.altKey) return;
      let type = null;
      if (e.code === "KeyP") type = "commandPalette";
      else if (e.code === "KeyK") type = "quickConnect";
      if (type === null) return;
      host.postMessage({ type: type });
      e.preventDefault();
      e.stopPropagation();
    }, true);

    // Ctrl+Shift+C / Ctrl+Shift+V, Ctrl+F4 (close tab — handled by the app shell)
    term.attachCustomKeyEventHandler(function (e) {
      if (e.type === "keydown" && e.ctrlKey && !e.shiftKey && e.code === "F4") {
        host.postMessage({ type: "closeTab" });
        return false;
      }
      if (e.type === "keydown" && e.ctrlKey && e.shiftKey && e.code === "KeyF") {
        openFind();
        return false;
      }
      if (e.type === "keydown" && e.ctrlKey && e.shiftKey && e.code === "Backslash") {
        host.postMessage({ type: "splitTab" });
        return false;
      }
      if (e.type === "keydown" && e.ctrlKey && e.shiftKey && e.code === "KeyE") {
        host.postMessage({ type: "filePane" });
        return false;
      }
      if (e.type === "keydown" && e.ctrlKey && e.shiftKey && e.code === "KeyT") {
        host.postMessage({ type: "newLocalTab" });
        return false;
      }
      if (e.type === "keydown" && e.ctrlKey && e.shiftKey && e.code === "KeyM") {
        ruler.toggleBookmark();
        return false;
      }
      if (e.type === "keydown" && e.ctrlKey && e.shiftKey && e.code === "KeyO") {
        ruler.toggleCommandsPanel();
        return false;
      }
      if (e.type === "keydown" && e.ctrlKey && e.shiftKey &&
          (e.code === "ArrowUp" || e.code === "ArrowDown")) {
        ruler.jumpCommand(e.code === "ArrowDown" ? 1 : -1);
        return false;
      }
      if (e.type === "keydown" && e.ctrlKey && e.shiftKey) {
        if (e.code === "KeyC" && term.hasSelection()) {
          host.postMessage({ type: "copy", text: term.getSelection() });
          return false;
        }
        if (e.code === "KeyV") {
          host.postMessage({ type: "paste" });
          return false;
        }
      }
      return true;
    });

    function reportSize() {
      host.postMessage({ type: "resize", cols: term.cols, rows: term.rows });
    }

    let fitPending = null;
    if (!readOnly) {
      new ResizeObserver(function () {
        if (fitPending) clearTimeout(fitPending);
        fitPending = setTimeout(function () {
          fitPending = null;
          fitPreservingTimestamps();
          reportSize();
        }, 40);
      }).observe(container);
    }


    // A write fence drains any older replay before reset. This makes rapid scrubbing
    // atomic even though xterm parses writes asynchronously.
    let replayGeneration = 0;
    function showReplay(msg) {
      const generation = ++replayGeneration;
      term.write("", function () {
        if (generation !== replayGeneration) return;
        term.reset();
        const columns = Math.max(1, msg.columns | 0);
        const rows = Math.max(1, msg.rows | 0);
        term.resize(columns, rows);
        const items = [];
        if (typeof msg.keyframe === "string") {
          items.push({ type: "o", data: msg.keyframe });
        }
        if (Array.isArray(msg.events)) {
          for (let i = 0; i < msg.events.length; i++) items.push(msg.events[i]);
        }
        let index = 0;
        function next() {
          if (generation !== replayGeneration || index >= items.length) return;
          const item = items[index++];
          if (item.type === "r") {
            const match = /^(\d+)x(\d+)$/.exec(String(item.data || ""));
            if (match) term.resize(Math.max(1, +match[1]), Math.max(1, +match[2]));
            next();
          } else if (item.type === "o") {
            term.write(b64ToBytes(item.data || ""), next);
          } else {
            next();
          }
        }
        next();
      });
    }

    let playback = null;
    let pendingPlaybackSeek = 0;
    let playbackBuildGeneration = 0;

    function loadPlayback(msg) {
      const buildGeneration = ++playbackBuildGeneration;
      ++replayGeneration;
      playback = null;
      const columns = Math.max(1, msg.columns | 0);
      const rows = Math.max(1, msg.rows | 0);
      const events = Array.isArray(msg.events) ? msg.events : [];
      const frames = [{ time: 0, index: 0, columns: columns, rows: rows, state: "" }];
      let currentColumns = columns;
      let currentRows = rows;
      let index = 0;
      let lastFrameTime = 0;
      let bytesSinceFrame = 0;
      if (term.element) term.element.style.visibility = "hidden";

      term.write("", function () {
        if (buildGeneration !== playbackBuildGeneration) return;
        term.reset();
        term.resize(columns, rows);

        function next() {
          if (buildGeneration !== playbackBuildGeneration) return;
          if (index >= events.length) {
            playback = { columns: columns, rows: rows, events: events, frames: frames };
            if (term.element) term.element.style.visibility = "visible";
            seekPlayback(pendingPlaybackSeek);
            return;
          }

          const item = events[index++];
          if (item.type === "r") {
            const match = /^(\d+)x(\d+)$/.exec(String(item.data || ""));
            if (match) {
              currentColumns = Math.max(1, +match[1]);
              currentRows = Math.max(1, +match[2]);
              term.resize(currentColumns, currentRows);
            }
            next();
            return;
          }
          if (item.type !== "o") {
            next();
            return;
          }

          const bytes = b64ToBytes(item.data || "");
          bytesSinceFrame += bytes.length;
          term.write(bytes, function () {
            const time = Number(item.time) || 0;
            if (time - lastFrameTime >= 10 || bytesSinceFrame >= 1024 * 1024) {
              frames.push({
                time: time,
                index: index,
                columns: currentColumns,
                rows: currentRows,
                state: serializer.serialize()
              });
              lastFrameTime = time;
              bytesSinceFrame = 0;
            }
            next();
          });
        }
        next();
      });
    }

    function seekPlayback(time) {
      pendingPlaybackSeek = Math.max(0, Number(time) || 0);
      if (!playback) return;
      const target = pendingPlaybackSeek;
      let frame = playback.frames[0];
      for (let i = playback.frames.length - 1; i >= 0; i--) {
        if (playback.frames[i].time <= target) {
          frame = playback.frames[i];
          break;
        }
      }

      const generation = ++replayGeneration;
      term.write("", function () {
        if (generation !== replayGeneration) return;
        term.reset();
        term.resize(frame.columns, frame.rows);
        let index = frame.index;

        function replayNext() {
          if (generation !== replayGeneration || index >= playback.events.length) return;
          const item = playback.events[index];
          if ((Number(item.time) || 0) > target) return;
          index++;
          if (item.type === "r") {
            const match = /^(\d+)x(\d+)$/.exec(String(item.data || ""));
            if (match) term.resize(Math.max(1, +match[1]), Math.max(1, +match[2]));
            replayNext();
          } else if (item.type === "o") {
            term.write(b64ToBytes(item.data || ""), replayNext);
          } else {
            replayNext();
          }
        }

        if (frame.state) term.write(frame.state, replayNext);
        else replayNext();
      });
    }
    // SSH/host -> UI
    // Rolling log of option pushes, inspectable via DevTools/CDP when diagnosing theme issues.
    window.__msgLog = [];
    onMessage = function (msg) {
      if (msg.type === "setOptions") {
        window.__msgLog.push(JSON.stringify(msg));
        if (window.__msgLog.length > 50) window.__msgLog.shift();
      }
      switch (msg.type) {
        case "output":
          writeHostOutput(msg);
          break;
        case "connected":
          connected = true;
          break;
        case "paste":
          pasteText(typeof msg.text === "string" ? msg.text : "");
          break;
        case "showReplay":
          showReplay(msg);
          break;
        case "loadPlayback":
          loadPlayback(msg);
          break;
        case "seekPlayback":
          seekPlayback(msg.time);
          break;
        case "disconnected":
          connected = false;
          ruler.writeOutput("\r\n\x1b[90m" + "─".repeat(Math.max(term.cols - 1, 10)) + "\x1b[0m\r\n", null);
          // Clean local exits arrive as severity "info" (dim, not warning-yellow); the
          // action verb keeps the hint honest for local tabs ("restart", not "reconnect").
          ruler.writeOutput(
            (msg.severity === "info" ? "\x1b[90m" : "\x1b[1;33m") +
            (msg.message || "Disconnected.") +
            "\x1b[0m Press Enter to " + (msg.action || "reconnect") + ".\r\n", null);
          break;
        case "divider":
          // Reconnect-in-place: visual separator, scrollback preserved.
          ruler.writeOutput("\r\n\x1b[90m" + "─".repeat(Math.max(term.cols - 1, 10)) + "\x1b[0m\r\n", null);
          break;
        case "notice":
          ruler.writeOutput("\x1b[90m" + (msg.message || "") + "\x1b[0m\r\n", null);
          break;
        case "setOptions":
          // Live settings changes only — initial options arrive via the init handshake.
          // Theme first, and layout-affecting setters fenced: a throw must not abort the rest.
          if (typeof msg.theme === "string") term.options.theme = getTheme(msg.theme);
          if (typeof msg.copyOnSelect === "boolean") copyOnSelect = msg.copyOnSelect;
          if (typeof msg.rightClickPaste === "boolean") rightClickPaste = msg.rightClickPaste;
          document.body.style.background = term.options.theme.background;
          document.body.classList.toggle("light-ui", isLightTheme(msg.theme));
          ruler.setTheme(getRuler(msg.theme));
          try {
            if (typeof msg.scrollback === "number" && msg.scrollback !== term.options.scrollback)
              term.options.scrollback = msg.scrollback;
            let layoutChanged = false;
            if (msg.fontSize && msg.fontSize !== term.options.fontSize) {
              term.options.fontSize = msg.fontSize;
              layoutChanged = true;
            }
            if (msg.fontFamily && msg.fontFamily !== term.options.fontFamily) {
              term.options.fontFamily = msg.fontFamily;
              layoutChanged = true;
            }
            if (layoutChanged) {
              fitPreservingTimestamps();
              reportSize();
            }
          } catch (err) {
            pageTrace("setOptions: " + (err && err.message));
          }
          break;
        case "setHighlights":
          highlighter.setRules(Array.isArray(msg.rules) ? msg.rules : []);
          ruler.setHighlightRules(Array.isArray(msg.rules) ? msg.rules : []);
          break;
        case "setRulerPresentation":
          ruler.setPresentation(msg.isSplit === true, msg.isGroupFocused !== false);
          break;
        case "setPromptPlatform":
          ruler.setPromptPlatform(msg.platform);
          break;
        case "toggleCommands":
          // The native tab-strip button; Ctrl+Shift+O inside the page does the same.
          ruler.toggleCommandsPanel();
          break;
        case "requestPromptContext":
          ruler._reportPromptContext(true);
          break;
        case "focus":
          term.focus();
          break;
        case "clear":
          term.clear();
          break;
      }
    };

    fitPreservingTimestamps();
    term.focus();
    host.postMessage({ type: "ready", cols: term.cols, rows: term.rows });
    if (!readOnly) setTimeout(captureKeyframe, 0);
  }
})();
</script>
</body>
</html>
